<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eyciee Flower</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, #bde0fe, #a8dadc);
    font-family: sans-serif;
    overflow: hidden;
  }

  .title {
    margin-bottom: 60px;
    font-size: 2.2rem;
    font-weight: 700;
    color: #4a4a68;
    text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    letter-spacing: 1px;
  }

  .flower {
    position: relative;
    width: 300px;
    height: 300px;
  }

  .head {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    animation: spin 6s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .stem {
    position: absolute;
    bottom: -140px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 160px;
    background: #4a7c3a;
    border-radius: 5px;
  }

  .leaf {
    position: absolute;
    bottom: -80px;
    left: 50%;
    width: 50px;
    height: 25px;
    background: #5fa052;
    border-radius: 0 50px 0 50px;
  }
  .leaf.left {
    transform: translate(-95%, 0) rotate(10deg);
  }
  .leaf.right {
    transform: translate(45%, 10px) rotate(-10deg) scaleX(-1);
  }

  .petal {
    position: absolute;
    width: 90px;
    height: 130px;
    background: radial-gradient(circle at 50% 90%, #ff85a1, #ff4d6d);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    top: 50%;
    left: 50%;
    transform-origin: 50% 100%;
    box-shadow: inset 0 -10px 15px rgba(0,0,0,0.08);
  }

  .petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
  .petal:nth-child(2) { transform: translate(-50%, -100%) rotate(60deg); }
  .petal:nth-child(3) { transform: translate(-50%, -100%) rotate(120deg); }
  .petal:nth-child(4) { transform: translate(-50%, -100%) rotate(180deg); }
  .petal:nth-child(5) { transform: translate(-50%, -100%) rotate(240deg); }
  .petal:nth-child(6) { transform: translate(-50%, -100%) rotate(300deg); }

  .center {
    position: absolute;
    width: 70px;
    height: 70px;
    background: radial-gradient(circle at 40% 40%, #ffe066, #f7b733);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.15);
    z-index: 2;
  }

  .center::before {
    content: "";
    position: absolute;
    inset: 8px;
    background-image: radial-gradient(circle, #e0952a 2px, transparent 2px);
    background-size: 10px 10px;
    border-radius: 50%;
    opacity: 0.5;
  }
</style>
</head>
<body>

  <div class="title">Bading dong</div>

  <div class="flower">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="head">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>
  </div>

</body>
</html>
